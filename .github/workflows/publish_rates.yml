name: Publish FCL Rates

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note (e.g. Week 21 update)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl pandas

      - name: Convert Excel to JSON
        run: python convert_rates.py

      - name: Commit and push rates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json index.html quote.html
          git diff --staged --quiet || git commit -m "Update FCL rates - ${{ github.event.inputs.note || 'manual trigger' }} [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp rates.json deploy/rates.json
          cp quote.html deploy/quote.html
          cp index.html deploy/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: false
