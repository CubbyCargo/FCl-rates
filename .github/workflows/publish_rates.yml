name: Publish FCL Rates

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note (e.g. Week 22 update)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Convert Excel to HTML and JSON
        run: python convert_rates.py

      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json index.html
          git diff --staged --quiet || git commit -m "Update FCL rates - ${{ github.event.inputs.note || 'manual trigger' }} [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          include_files: rates.json,index.html
